<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <defs>
    <style>
      .rh-text {
        fill: #1e3a8a;
        font-family: 'Arial Black', 'Arial Bold', sans-serif;
        font-weight: 900;
        font-size: 56px;
        letter-spacing: 2px;
      }
      .subtitle {
        fill: #1e3a8a;
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: normal;
      }
    </style>
  </defs>

  <!-- Background semi-transparent white rectangle -->
  <rect x="0" y="0" width="300" height="120" fill="white" opacity="0.85" rx="10"/>

  <!-- RH Text -->
  <text x="150" y="55" text-anchor="middle" class="rh-text">RH</text>

  <!-- Hebrew subtitle -->
  <text x="150" y="85" text-anchor="middle" class="subtitle">שיווק נכסים</text>
</svg>
