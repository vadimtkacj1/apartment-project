server {
    listen 80;
    listen [::]:80;
    server_name _; 

    access_log /var/log/nginx/apartment-access.log;
    error_log /var/log/nginx/apartment-error.log;

    # Root directory for static files
    root /opt/apartment-project/public;

    # Proxy /uploads to Next.js — один источник (UPLOADS_DIR)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cache-Control задаёт API (max-age=0), не переопределяем — чтобы не кешировать 404
    }

    # Serve images from public directory
    location /images/ {
        alias /opt/apartment-project/public/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve other static files from public
    location ~* ^/(.*\.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot|css|js))$ {
        try_files /$1 @nextjs;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js static assets
    location ^~ /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
    }

    # Next.js image optimization
    location ^~ /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # All other requests go to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Fallback to Next.js if file not found in public
    location @nextjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
