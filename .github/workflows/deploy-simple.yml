name: Deploy to Production (Simple)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy via Git Pull
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          debug: true
          envs: NEXTAUTH_SECRET,NEXTAUTH_URL,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,DATABASE_URL,EMAIL_SERVER_HOST,EMAIL_SERVER_PORT,EMAIL_SERVER_USER,EMAIL_SERVER_PASSWORD,EMAIL_TO
          script: |
            set -e

            APP_DIR="/opt/apartment-project"
            APP_NAME="apartment-project"
            DB_DIR="/var/lib/apartment-project"
            DB_BACKUP_DIR="/tmp/apartment-project-db-backup"

            echo "🚀 Starting deployment via Git Pull..."

            # This build uses the PostgreSQL driver adapter. Prefer a server-side
            # DATABASE_URL override (keeps the DB password OFF GitHub) and fall back
            # to the deploy secret otherwise.
            if [ -f /etc/apartment/postgres.env ]; then
              # shellcheck disable=SC1091
              . /etc/apartment/postgres.env
              export DATABASE_URL
              echo "🔻 Using server-side DATABASE_URL override (/etc/apartment/postgres.env)"
            fi

            # Required production secrets/env checks
            if [ -z "$DATABASE_URL" ]; then
              echo "❌ DATABASE_URL is empty"
              exit 1
            fi
            # Fail BEFORE touching the running app if the URL is not Postgres — this
            # build cannot talk to SQLite, so a misconfig must abort, not serve 500s.
            case "$DATABASE_URL" in
              postgres://*|postgresql://*) : ;;
              *) echo "❌ DATABASE_URL is not a PostgreSQL URL — refusing to deploy the Postgres build."; exit 1 ;;
            esac
            if [ -z "$NEXTAUTH_SECRET" ]; then
              echo "❌ NEXTAUTH_SECRET is empty"
              exit 1
            fi
            if [ -z "$NEXTAUTH_URL" ]; then
              echo "❌ NEXTAUTH_URL is empty"
              exit 1
            fi

            # Create directories
            sudo mkdir -p $APP_DIR $DB_DIR
            sudo chown $USER:$USER $APP_DIR $DB_DIR
            cd "$APP_DIR"

            # Backup existing .env if it exists
            if [ -f "$APP_DIR/.env" ]; then
              echo "💾 Backing up existing .env..."
              cp "$APP_DIR/.env" /tmp/.env.backup
            fi

            # Backup local sqlite databases to keep server data unchanged
            echo "💾 Backing up local database files..."
            rm -rf "$DB_BACKUP_DIR"
            mkdir -p "$DB_BACKUP_DIR"
            if [ -d "$APP_DIR" ]; then
              find "$APP_DIR" -type f \( -name "*.db" -o -name "*.db-*" \) -exec cp -p --parents {} "$DB_BACKUP_DIR" \; 2>/dev/null || true
            fi

            # Clone or pull repository
            if [ -d "$APP_DIR/.git" ]; then
              echo "📥 Pulling latest changes..."
              cd "$APP_DIR"
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            else
              echo "📥 Preparing repository in existing directory..."
              cd "$APP_DIR"
              if [ -n "$(ls -A "$APP_DIR")" ]; then
                # Keep only .env in place. DB files are already backed up and restored later.
                find "$APP_DIR" -mindepth 1 \
                  ! -name ".env" \
                  -exec rm -rf {} +
              fi
              git init
              git remote remove origin 2>/dev/null || true
              git remote add origin https://github.com/${{ github.repository }}
              git fetch origin
              git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Restore local sqlite databases after git update
            echo "♻️ Restoring local database files..."
            if [ -d "$DB_BACKUP_DIR" ]; then
              cp -a "$DB_BACKUP_DIR"/. / 2>/dev/null || true
              rm -rf "$DB_BACKUP_DIR"
            fi

            # Create or restore .env
            if [ -f "/tmp/.env.backup" ]; then
              echo "♻️ Restoring existing .env..."
              cp /tmp/.env.backup .env
              rm /tmp/.env.backup
            elif [ ! -f .env ]; then
              echo "📝 Creating .env file..."
              cat > .env << ENVFILE
            NODE_ENV=production
            PORT=3000
            HOSTNAME=0.0.0.0
            DATABASE_URL="$DATABASE_URL"
            NEXTAUTH_SECRET="$NEXTAUTH_SECRET"
            NEXTAUTH_URL="$NEXTAUTH_URL"
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"
            EMAIL_SERVER_HOST="$EMAIL_SERVER_HOST"
            EMAIL_SERVER_PORT=$EMAIL_SERVER_PORT
            EMAIL_SERVER_USER="$EMAIL_SERVER_USER"
            EMAIL_SERVER_PASSWORD="$EMAIL_SERVER_PASSWORD"
            EMAIL_TO="$EMAIL_TO"
            ENVFILE
            fi

            # Ensure runtime secrets are up to date even when .env already existed
            upsert_env() {
              key="$1"
              value="$2"
              escaped_value=$(printf '%s\n' "$value" | sed -e 's/[\/&]/\\&/g')
              if grep -q "^${key}=" .env; then
                sed -i "s/^${key}=.*/${key}=\"${escaped_value}\"/" .env
              else
                echo "${key}=\"${value}\"" >> .env
              fi
            }

            upsert_env "DATABASE_URL" "$DATABASE_URL"
            upsert_env "NEXTAUTH_SECRET" "$NEXTAUTH_SECRET"
            upsert_env "NEXTAUTH_URL" "$NEXTAUTH_URL"
            upsert_env "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"
            upsert_env "EMAIL_SERVER_HOST" "$EMAIL_SERVER_HOST"
            upsert_env "EMAIL_SERVER_PORT" "$EMAIL_SERVER_PORT"
            upsert_env "EMAIL_SERVER_USER" "$EMAIL_SERVER_USER"
            upsert_env "EMAIL_SERVER_PASSWORD" "$EMAIL_SERVER_PASSWORD"
            upsert_env "EMAIL_TO" "$EMAIL_TO"

            # Install dependencies
            echo "📦 Installing dependencies..."
            npm ci --production=false

            # Build application with environment variables
            echo "🏗️ Building application..."
            export NODE_ENV=production
            export NEXTAUTH_SECRET="$NEXTAUTH_SECRET"
            export NEXTAUTH_URL="$NEXTAUTH_URL"
            export NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"
            rm -rf .next
            npm run build

            # Prepare standalone runtime assets to avoid missing chunk/static files in production
            echo "📁 Preparing standalone static assets..."
            mkdir -p .next/standalone/.next
            rm -rf .next/standalone/.next/static .next/standalone/public
            cp -R .next/static .next/standalone/.next/static
            if [ -d public ]; then
              cp -R public .next/standalone/public
            fi

            # Apply additive schema changes (new tables/columns) to the server DB.
            # `prisma db push` is non-destructive for additive changes and — unlike
            # `migrate deploy` — works regardless of the migration-history state. The
            # DB was backed up above; db push aborts rather than drop data, so existing
            # rows are preserved. Required so new columns (e.g. User.isActive, Property
            # SEO fields) and tables (Inquiry) exist before the app queries them.
            echo "🗄️ Syncing database schema (additive, non-destructive)..."
            # NOTE: Prisma 7 removed `--skip-generate`; passing it made this step
            # fail on every deploy, and `|| echo` swallowed the error — so no schema
            # change had reached the server DB since the Prisma 7 upgrade.
            npx prisma db push || echo "⚠️ Schema sync issue — check logs (app may need new columns)."

            # Install PM2 if not available
            if ! command -v pm2 &> /dev/null; then
              echo "📦 Installing PM2..."
              npm install -g pm2
            fi

            # Restart application
            echo "🔄 Restarting application..."
            pm2 delete $APP_NAME || true
            pm2 start server.js --name $APP_NAME --cwd "$APP_DIR/.next/standalone" --update-env
            pm2 save

            # Install/refresh automatic backups (DB + uploads + .env) every 6h.
            # Idempotent: re-run on every deploy so the schedule self-heals and
            # always carries the latest backup script.
            if [ -f "$APP_DIR/scripts/backup-server.sh" ]; then
              echo "💾 Installing periodic backup job..."
              sudo install -m 750 "$APP_DIR/scripts/backup-server.sh" /usr/local/bin/apartment-backup
              sudo mkdir -p /var/backups/apartment-project
              sudo chmod 700 /var/backups/apartment-project
              sudo touch /var/log/apartment-backup.log
              sudo tee /etc/cron.d/apartment-project-backup > /dev/null << 'CRON'
            SHELL=/bin/bash
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            # Every 6 hours; flock prevents overlapping runs.
            0 */6 * * * root /usr/bin/flock -n /tmp/apartment-backup.lock /usr/local/bin/apartment-backup >> /var/log/apartment-backup.log 2>&1
            CRON
              sudo chmod 644 /etc/cron.d/apartment-project-backup
              sudo systemctl restart cron 2>/dev/null || sudo systemctl restart crond 2>/dev/null || true
              # Take one backup right away so a fresh server is protected immediately.
              sudo /usr/local/bin/apartment-backup >> /var/log/apartment-backup.log 2>&1 || true
              echo "✅ Backup schedule installed (every 6 hours)"
            fi

            # Health check
            sleep 5
            if curl -f -s http://localhost:3000 > /dev/null; then
              echo "✅ Deployment successful!"
              pm2 status
            else
              echo "❌ Health check failed!"
              pm2 logs $APP_NAME --lines 30 --nostream
              exit 1
            fi
