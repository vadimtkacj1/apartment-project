name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: "file:./dev.db"

      - name: Create deployment package
        run: |
          mkdir -p deploy
          if [ ! -d ".next/standalone" ]; then
            echo "❌ Error: .next/standalone not found"
            exit 1
          fi

          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          if [ -d "public" ]; then
            mkdir -p deploy/public
            cp -r public/. deploy/public/
          fi

          if [ -d "prisma" ]; then
            mkdir -p deploy/prisma
            cp -r prisma/. deploy/prisma/
          fi

          cp package.json deploy/
          if [ -f "package-lock.json" ]; then
            cp package-lock.json deploy/
          fi

          tar -czf deploy.tar.gz deploy/

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          envs: DATABASE_URL,NEXTAUTH_SECRET,NEXTAUTH_URL
          script: |
            set -e
            APP_DIR="/opt/apartment-project"
            APP_NAME="apartment-project"
            APP_PORT=3000

            echo "🚀 Starting deployment..."

            sudo mkdir -p $APP_DIR
            sudo chown $USER:$USER $APP_DIR

            cd $APP_DIR
            tar -xzf /tmp/deploy.tar.gz
            cp -r deploy/. .
            rm -rf deploy

            echo "📝 Writing .env from GitHub Secrets..."
            {
              echo "NODE_ENV=production"
              echo "PORT=${APP_PORT}"
              echo "HOSTNAME=0.0.0.0"
              echo "DATABASE_URL=${DATABASE_URL:-file:./dev.db}"
              echo "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}"
              echo "NEXTAUTH_URL=${NEXTAUTH_URL}"
            } > .env

            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            pm2 stop $APP_NAME || true
            pm2 delete $APP_NAME || true

            # Export .env vars into the shell so pm2 inherits them
            set -a
            source .env
            set +a

            pm2 start server.js --name $APP_NAME --update-env
            pm2 save

            sleep 5

            if curl -f http://localhost:${APP_PORT} > /dev/null 2>&1; then
              echo "✅ Deployment successful!"
              pm2 status
            else
              echo "⚠️ Warning: Health check failed"
              pm2 logs $APP_NAME --lines 30
              exit 1
            fi

            # Configure nginx to proxy port 80 → app port
            if command -v nginx &> /dev/null; then
              NGINX_CONF="/etc/nginx/sites-available/${APP_NAME}"
              printf 'server {\n    listen 80;\n    server_name _;\n    location / {\n        proxy_pass http://127.0.0.1:%s;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection '"'"'upgrade'"'"';\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_cache_bypass $http_upgrade;\n    }\n}\n' "${APP_PORT}" | sudo tee $NGINX_CONF > /dev/null
              sudo ln -sf $NGINX_CONF /etc/nginx/sites-enabled/${APP_NAME}
              sudo nginx -t && sudo systemctl reload nginx
              echo "✅ nginx configured and reloaded"
            else
              echo "ℹ️  nginx not found — app is running on port ${APP_PORT}"
            fi

            rm -f /tmp/deploy.tar.gz
