name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        id: nextjs-cache
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-cache-

      - name: Post Cache Next.js build cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**', 'next.config.*', 'tsconfig.json') }}

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: "file:./dev.db"

      - name: Copy Prisma files to standalone
        run: |
          mkdir -p .next/standalone/node_modules/.prisma
          mkdir -p .next/standalone/node_modules/@prisma/client/runtime
          cp -r node_modules/.prisma/. .next/standalone/node_modules/.prisma/ 2>/dev/null || true
          cp -r node_modules/@prisma/client/runtime/. .next/standalone/node_modules/@prisma/client/runtime/ 2>/dev/null || true

      - name: Create deployment package
        run: |
          mkdir -p deploy
          if [ ! -d ".next/standalone" ]; then
            echo "❌ Error: .next/standalone not found"
            exit 1
          fi

          # Copy standalone build contents
          cp -r .next/standalone/. deploy/
          
          # Copy static files to correct location
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          
          # Ensure BUILD_ID is in the right place for standalone mode
          if [ -f ".next/BUILD_ID" ]; then
            mkdir -p deploy/.next
            cp .next/BUILD_ID deploy/.next/BUILD_ID
          fi
          
          # If standalone has .next/server, ensure it's accessible
          if [ -d ".next/standalone/.next/server" ]; then
            mkdir -p deploy/.next/server
            cp -r .next/standalone/.next/server/. deploy/.next/server/
          fi

          if [ -d "public" ]; then
            mkdir -p deploy/public
            cp -r public/. deploy/public/
          fi

          if [ -d "prisma" ]; then
            mkdir -p deploy/prisma
            cp -r prisma/. deploy/prisma/
          fi

          if [ -d "src" ]; then
            mkdir -p deploy/src
            cp -r src/. deploy/src/
          fi

          # Copy configuration files needed for building
          if [ -f "tsconfig.json" ]; then
            cp tsconfig.json deploy/
          fi
          
          if [ -f "middleware.ts" ]; then
            cp middleware.ts deploy/
          fi
          
          if [ -f "next.config.ts" ]; then
            cp next.config.ts deploy/
          fi
          
          if [ -f "next.config.js" ]; then
            cp next.config.js deploy/
          fi

          cp package.json deploy/
          if [ -f "package-lock.json" ]; then
            cp package-lock.json deploy/
          fi

          tar -czf deploy.tar.gz deploy/

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          envs: DATABASE_URL,NEXTAUTH_SECRET,NEXTAUTH_URL
          script: |
            set -e
            APP_DIR="/opt/apartment-project"
            APP_NAME="apartment-project"
            PORT=3000

            echo "🚀 Starting deployment..."

            sudo mkdir -p $APP_DIR
            sudo chown $USER:$USER $APP_DIR

            cd $APP_DIR
            tar -xzf /tmp/deploy.tar.gz
            cp -r deploy/. .
            rm -rf deploy

            # ==========================================
            # DATABASE PERSISTENCE FIX
            # ==========================================
            # This section ensures the database is NOT deleted on each deployment
            # For SQLite: Store database file outside deployment directory
            # For PostgreSQL/MySQL: No changes needed, DATABASE_URL points to external server
            # ==========================================
            DB_DIR="/var/lib/apartment-project"
            sudo mkdir -p $DB_DIR
            sudo chown $USER:$USER $DB_DIR

            # Update DATABASE_URL to point to persistent location (only for SQLite)
            if [[ "$DATABASE_URL" == *"file:"* ]]; then
              # Extract filename from DATABASE_URL (e.g., "file:./dev.db" -> "dev.db")
              DB_FILE=$(echo "$DATABASE_URL" | sed 's/.*file:\(\.\/\)\?//' | sed 's/?.*//')
              # Update DATABASE_URL to use persistent path
              DATABASE_URL="file:${DB_DIR}/${DB_FILE}"
              echo "📁 Using persistent SQLite database: $DATABASE_URL"
            else
              echo "📁 Using external database (PostgreSQL/MySQL/etc.): ${DATABASE_URL:0:30}..."
            fi
            
            # Create proper .next directory structure for standalone mode
            # Standalone build needs .next/server and .next/static directories
            if [ -d ".next/standalone" ]; then
              echo "📦 Setting up .next directory structure..."
              # Create .next directory if it doesn't exist
              mkdir -p .next
              
              # Copy server files from standalone
              if [ -d ".next/standalone/.next/server" ]; then
                mkdir -p .next/server
                cp -r .next/standalone/.next/server/. .next/server/ 2>/dev/null || true
              fi
              
              # Ensure static directory exists (should already be copied)
              if [ ! -d ".next/static" ]; then
                echo "⚠️  Warning: .next/static not found, creating..."
                mkdir -p .next/static
              fi
              
              # Create BUILD_ID file if it doesn't exist
              if [ ! -f ".next/BUILD_ID" ] && [ -f ".next/standalone/.next/BUILD_ID" ]; then
                cp .next/standalone/.next/BUILD_ID .next/BUILD_ID 2>/dev/null || true
              fi
              
              echo "✓ .next directory structure created"
            fi

            # Debug: Check if environment variables are set
            echo "🔍 Checking environment variables..."
            if [ -z "$DATABASE_URL" ]; then
              echo "❌ ERROR: DATABASE_URL is not set!"
              echo "Please configure the DATABASE_URL secret in GitHub Settings > Secrets > Actions"
              exit 1
            else
              echo "✓ DATABASE_URL is set (length: ${#DATABASE_URL} chars)"
            fi

            # Generate NEXTAUTH_SECRET if not provided
            if [ -z "$NEXTAUTH_SECRET" ]; then
              echo "🔑 Generating NEXTAUTH_SECRET..."
              NEXTAUTH_SECRET=$(openssl rand -base64 32)
              echo "✓ NEXTAUTH_SECRET generated"
            fi

            # Determine NEXTAUTH_URL
            if [ -z "$NEXTAUTH_URL" ] || [ "$NEXTAUTH_URL" = "" ]; then
              # Try to get server IP or use default
              SERVER_IP=$(hostname -I | awk '{print $1}' 2>/dev/null || echo "")
              if [ -n "$SERVER_IP" ]; then
                NEXTAUTH_URL="http://${SERVER_IP}"
              else
                NEXTAUTH_URL="http://localhost:3000"
              fi
              echo "🔗 Using default NEXTAUTH_URL: $NEXTAUTH_URL"
            else
              echo "✓ NEXTAUTH_URL is set: $NEXTAUTH_URL"
            fi

            # Update .env file with current environment variables
            echo "📝 Updating .env..."
            {
              echo "NODE_ENV=production"
              echo "PORT=3000"
              echo "HOSTNAME=0.0.0.0"
              echo "# Database stored in persistent location: $DB_DIR"
              echo "DATABASE_URL=\"${DATABASE_URL}\""
              echo "NEXTAUTH_SECRET=\"${NEXTAUTH_SECRET}\""
              echo "NEXTAUTH_URL=\"${NEXTAUTH_URL}\""
            } > .env

            # Verify .env was created correctly
            if [ -f ".env" ] && grep -q "DATABASE_URL=" .env; then
              echo "✓ .env file created successfully"
            else
              echo "❌ ERROR: Failed to create .env file"
              exit 1
            fi

            # Run database migrations
            echo "🗄️ Running database migrations..."
            if ! npx prisma migrate deploy --schema=$APP_DIR/prisma/schema.prisma; then
              echo "⚠️ Migration failed, attempting to baseline..."
              # Mark all existing migrations as applied
              for migration in $APP_DIR/prisma/migrations/*/; do
                if [ -d "$migration" ]; then
                  migration_name=$(basename "$migration")
                  echo "📌 Marking as applied: $migration_name"
                  npx prisma migrate resolve --applied "$migration_name" --schema=$APP_DIR/prisma/schema.prisma || true
                fi
              done
              echo "🔄 Retrying migration deployment..."
              npx prisma migrate deploy --schema=$APP_DIR/prisma/schema.prisma
            fi

            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # Clean up all old PM2 processes (including any duplicates)
            echo "🧹 Cleaning up old PM2 processes..."
            pm2 stop all || true
            pm2 delete all || true
            
            # Remove any processes with similar names
            pm2 stop "apartmen" || true
            pm2 delete "apartmen" || true
            pm2 stop $APP_NAME || true
            pm2 delete $APP_NAME || true
            
            # Clear PM2 logs
            pm2 flush || true

            echo "▶️ Starting application on port $PORT..."
            # Verify .env file exists and has content
            if [ ! -f ".env" ] || [ ! -s ".env" ]; then
              echo "❌ ERROR: .env file is missing or empty"
              exit 1
            fi
            
            echo "📋 Environment variables from .env:"
            grep -E "^(NODE_ENV|PORT|HOSTNAME|DATABASE_URL|NEXTAUTH_SECRET|NEXTAUTH_URL)=" .env | sed 's/=.*/=***/' || true
            
            # Start PM2 with environment from .env file
            pm2 start server.js --name $APP_NAME --update-env
            pm2 save

            sleep 5

            if curl -f http://localhost:$PORT > /dev/null 2>&1; then
              echo "✅ Deployment successful!"
              pm2 status
            else
              echo "⚠️ Warning: Health check failed"
              pm2 logs $APP_NAME --lines 30
              exit 1
            fi

            rm -f /tmp/deploy.tar.gz