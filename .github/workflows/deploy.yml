name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx -y prisma@7.3.0 generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build application
        run: npx next build
        env:
          NODE_ENV: production
          DATABASE_URL: "file:./dev.db"

      - name: Create deployment package
        run: |
          mkdir -p deploy
          if [ ! -d ".next/standalone" ]; then
            echo "❌ Error: .next/standalone not found"
            exit 1
          fi

          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          if [ -d "public" ]; then
            mkdir -p deploy/public
            cp -r public/. deploy/public/
          fi

          if [ -d "prisma" ]; then
            mkdir -p deploy/prisma
            cp -r prisma/. deploy/prisma/
          fi

          cp package.json deploy/
          if [ -f "package-lock.json" ]; then
            cp package-lock.json deploy/
          fi

          tar -czf deploy.tar.gz deploy/

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -e
            APP_DIR="/opt/apartment-project"
            APP_NAME="apartment-project"
            PORT=80

            echo "🚀 Starting deployment..."

            sudo mkdir -p $APP_DIR
            sudo chown $USER:$USER $APP_DIR

            cd $APP_DIR
            tar -xzf /tmp/deploy.tar.gz
            cp -r deploy/. .
            rm -rf deploy

            cat > .env << 'EOF'
            NODE_ENV=production
            PORT=80
            HOSTNAME=0.0.0.0
            DATABASE_URL=file:./dev.db
            NEXTAUTH_SECRET=aksSjY+UUhVgdCJy15IwmSMIaZepc98C3Eq3pOvjnso=
            NEXTAUTH_URL=http://localhost:80
            EOF

            if [ -f "package.json" ]; then
              sudo apt-get update -qq
              sudo apt-get install -y python3 make g++ || true
              npm ci --production --ignore-scripts || npm install --production --ignore-scripts
            fi

            if [ -d "prisma" ]; then
              npx prisma@7 generate || echo "⚠️ Warning: Prisma generate failed"
            fi

            if [ -d "prisma/migrations" ]; then
              npx prisma@7 migrate deploy || echo "⚠️ Warning: Migrations failed"
            fi

            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            pm2 stop $APP_NAME || true
            pm2 delete $APP_NAME || true

            pm2 start server.js --name $APP_NAME --update-env
            pm2 save

            sleep 5

            if curl -f http://localhost:$PORT > /dev/null 2>&1; then
              echo "✅ Deployment successful!"
              pm2 status
            else
              echo "⚠️ Warning: Health check failed"
              pm2 logs $APP_NAME --lines 30
              exit 1
            fi

            rm -f /tmp/deploy.tar.gz
