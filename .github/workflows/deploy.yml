name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: "file:./dev.db"

      - name: Create deployment package
        run: |
          mkdir -p deploy
          # Standalone build
          cp -r .next/standalone/. deploy/
          # Static files
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          # Public & Prisma
          [ -d "public" ] && cp -r public deploy/
          [ -d "prisma" ] && cp -r prisma deploy/
          # Package info
          cp package.json deploy/
          [ -f "package-lock.json" ] && cp package-lock.json deploy/
          
          tar -czf deploy.tar.gz deploy/

      - name: Deploy to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 20m
          source: "deploy.tar.gz"
          target: "~/deploy-tmp"
          overwrite: true
          rm: false

      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          envs: DATABASE_URL,NEXTAUTH_SECRET,NEXTAUTH_URL
          script: |
            set -e
            APP_DIR="/opt/apartment-project"
            APP_NAME="apartment-project"
            PORT=3000
            DB_DIR="/var/lib/apartment-project"
            DEPLOY_TMP="$HOME/deploy-tmp"

            echo "🚀 Starting deployment..."

            sudo mkdir -p $APP_DIR $DB_DIR
            sudo chown $USER:$USER $APP_DIR $DB_DIR

            # Unpack - ensure we have the correct file and permissions
            cd $DEPLOY_TMP
            # Find the actual tar file (SCP action may rename it)
            TAR_FILE=$(ls -t $DEPLOY_TMP/*.tar.gz 2>/dev/null | head -1 || echo "$DEPLOY_TMP/deploy.tar.gz")
            if [ ! -f "$TAR_FILE" ]; then
              echo "❌ Error: Tar file not found in $DEPLOY_TMP"
              ls -la $DEPLOY_TMP/*.tar.gz || true
              exit 1
            fi
            echo "📦 Extracting $TAR_FILE to $APP_DIR..."
            cd $APP_DIR
            tar -xzf "$TAR_FILE" --strip-components=1
            chmod -R u+w $APP_DIR
            
            # Database Persistence Logic
            if [[ "$DATABASE_URL" == *"file:"* ]]; then
              DB_FILE=$(echo "$DATABASE_URL" | sed 's/.*file:\(\.\/\)\?//' | sed 's/?.*//')
              DATABASE_URL="file:${DB_DIR}/${DB_FILE}"
            fi

            # Create .env
            echo "📝 Updating .env..."
            cat <<EOT > .env
            NODE_ENV=production
            PORT=$PORT
            HOSTNAME=0.0.0.0
            DATABASE_URL="$DATABASE_URL"
            NEXTAUTH_SECRET="${NEXTAUTH_SECRET:-$(openssl rand -base64 32)}"
            NEXTAUTH_URL="${NEXTAUTH_URL:-http://localhost:3000}"
            EOT

            # Database Migrations
            echo "🗄️ Running database migrations..."
            export PRISMA_SCHEMA=$APP_DIR/prisma/schema.prisma
            npx prisma migrate deploy || echo "⚠️ Migration issue, check logs."

            # PM2 Setup
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2 --silent
            fi

            pm2 delete $APP_NAME || true
            pm2 start server.js --name $APP_NAME --update-env
            pm2 save

            # Cleanup and Health check
            rm -f $DEPLOY_TMP/*.tar.gz
            sleep 5
            if curl -f -s http://localhost:$PORT > /dev/null; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Health check failed!"
              pm2 logs $APP_NAME --lines 20 --nostream
              exit 1
            fi