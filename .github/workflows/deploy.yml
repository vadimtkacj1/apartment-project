name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: "file:./dev.db"

      - name: Copy Prisma files to standalone
        run: |
          mkdir -p .next/standalone/node_modules/.prisma
          mkdir -p .next/standalone/node_modules/@prisma/client/runtime
          cp -r node_modules/.prisma/. .next/standalone/node_modules/.prisma/ 2>/dev/null || true
          cp -r node_modules/@prisma/client/runtime/. .next/standalone/node_modules/@prisma/client/runtime/ 2>/dev/null || true

      - name: Create deployment package
        run: |
          mkdir -p deploy
          if [ ! -d ".next/standalone" ]; then
            echo "❌ Error: .next/standalone not found"
            exit 1
          fi

          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          if [ -d "public" ]; then
            mkdir -p deploy/public
            cp -r public/. deploy/public/
          fi

          if [ -d "prisma" ]; then
            mkdir -p deploy/prisma
            cp -r prisma/. deploy/prisma/
          fi

          if [ -d "src" ]; then
            mkdir -p deploy/src
            cp -r src/. deploy/src/
          fi

          cp package.json deploy/
          if [ -f "package-lock.json" ]; then
            cp package-lock.json deploy/
          fi

          tar -czf deploy.tar.gz deploy/

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Execute deployment on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          envs: DATABASE_URL,NEXTAUTH_SECRET,NEXTAUTH_URL
          script: |
            set -e
            APP_DIR="/opt/apartment-project"
            APP_NAME="apartment-project"
            PORT=80

            echo "🚀 Starting deployment..."

            sudo mkdir -p $APP_DIR
            sudo chown $USER:$USER $APP_DIR

            cd $APP_DIR
            tar -xzf /tmp/deploy.tar.gz
            cp -r deploy/. .
            rm -rf deploy

            # Update .env file with current environment variables
            echo "📝 Updating .env..."
            printf 'NODE_ENV=production\nPORT=80\nHOSTNAME=0.0.0.0\nDATABASE_URL=%s\nNEXTAUTH_SECRET=%s\nNEXTAUTH_URL=%s\n' \
              "${DATABASE_URL:-file:./dev.db}" \
              "${NEXTAUTH_SECRET:-}" \
              "${NEXTAUTH_URL:-http://localhost:80}" > .env

            # Export environment variables for Prisma
            export DATABASE_URL="${DATABASE_URL}"
            export NEXTAUTH_SECRET="${NEXTAUTH_SECRET}"
            export NEXTAUTH_URL="${NEXTAUTH_URL}"

            # Run database migrations
            echo "🗄️ Running database migrations..."
            npx prisma migrate deploy --schema=$APP_DIR/prisma/schema.prisma

            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            pm2 stop $APP_NAME || true
            pm2 delete $APP_NAME || true

            pm2 start server.js --name $APP_NAME --node-args="--env-file=$APP_DIR/.env"
            pm2 save

            sleep 5

            if curl -f http://localhost:$PORT > /dev/null 2>&1; then
              echo "✅ Deployment successful!"
              pm2 status
            else
              echo "⚠️ Warning: Health check failed"
              pm2 logs $APP_NAME --lines 30
              exit 1
            fi

            rm -f /tmp/deploy.tar.gz